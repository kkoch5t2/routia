name: Overnight timer regression

on: pull_request

permissions:
  contents: read

jobs:
  focus-store:
    name: Test overnight timer records
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Build QA and test APKs
        run: ./gradlew --no-daemon -ProutiaReportQa :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the storage regression suite on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash .github/scripts/test-focus-store.sh
